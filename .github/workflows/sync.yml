# Ciclo agendado: calendário, estatísticas pós-jogo, fechamento de rodada e waivers.
# Configure em Settings → Secrets: APP_URL (ex.: https://ucl-fantasy.vercel.app) e CRON_SECRET.
name: sync

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Chamar /api/cron
        run: |
          curl --fail-with-body --max-time 300 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.APP_URL }}/api/cron"
